# DNS防泄露版本
# 必读！！！
# 注意规则在满足自己需求情况下，尽量做到精简，不要过度复杂，以免影响性能。
# 跑裸核用户请自行去掉下方控制面板模块的注释。
# 机场订阅
proxy-providers:
  pq:
    url: "https://dash.pqjc.site/api/v1/pq/77d1937a92916710ffe17021afffe99e"
    type: http
    filter: "(?i)新加坡|日本|美国|台湾|韩国"
    interval: 43200
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 🎯 全球直连

  mj:
    url: "https://47.112.97.173:5000/api/v1/client/subscribe?token=e2014b85bccbd5ce49734af632b84862"
    type: http
    filter: "(?i)新加坡|日本|美国|台湾|韩国"
    interval: 43200
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 🎯 全球直连
    
# 节点信息
proxies: []

# 全局配置 
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 为防止使用插件朋友遇到面板问题，我注释掉了此模块。
#external-controller: 0.0.0.0:9090
#secret: ""
#external-ui: ui
#external-ui-name: zashboard
#external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探（fakeip下其实可以不用嗅探）
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  #使用nikki，混入全部不修改的情况，开启接口指定为nikki
  #device: nikki
  #使用仅内核自行修改下面三项为true
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  # 用于解析 DNS 服务器域名（基础DNS）
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
# 主DNS（主流写法：国内优先，如彻底防泄露可改为国外8.8..
  nameserver:
    - https://8.8.8.8/dns-query#RULES&ecs=223.5.5.0/24
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"
 
# 出站策略，根据自己情况调整每个策略里分组排序，增删都可以，比如把美国自动放到第一个，比如删除香港故转，注意别漏掉表情逗号等。
# 如果相应分组没有筛选到对应的国家，请根据自己节点名字调整筛选关键字。
# 没有再使用锚点，是考虑很多新手修改难度，这样新手修改某个分组更容易些。
proxy-groups:
  - {name: 🎯 全球直连, type: select, proxies: [DIRECT]}  
  - {name: 🚀 节点选择, type: select, use: [pq, mj]}
  - {name: 📹 YouTube, type: select, use: [pq, mj]}
  - {name: 🤖 ChatGPT, type: select, use: [pq, mj], proxies: [🚀 节点选择]}
  - {name: 👨🏿‍💻 GitHub, type: select, use: [pq, mj], proxies: [🚀 节点选择]}
  - {name: 🐬 OneDrive, type: select, use: [pq, mj], proxies: [📹 YouTube]}
  - {name: 🪟 Microsoft, type: select, use: [pq, mj], proxies: [🚀 节点选择]}
  - {name: 🎵 TikTok, type: select, use: [pq, mj], proxies: [📹 YouTube]}
  - {name: 📲 Telegram, type: select, use: [pq, mj], proxies: [🚀 节点选择]}
  - {name: 🎥 NETFLIX, type: select, use: [pq, mj], proxies: [📹 YouTube]}
  - {name: 💶 PayPal, type: select, use: [pq, mj], proxies: [🚀 节点选择]}
  - {name: 🐟 漏网之鱼, type: select, use: [pq, mj], proxies: [📹 YouTube, 🚀 节点选择]}

# 规则匹配
rules:
  - RULE-SET,private_ip,🎯 全球直连,no-resolve
  - RULE-SET,private_domain,🎯 全球直连
  - RULE-SET,NAS,🎯 全球直连
  - DOMAIN-SUFFIX,qichiyu.com,🚀 节点选择
  - RULE-SET,proxylite,🚀 节点选择
  - RULE-SET,ai,🤖 ChatGPT
  - RULE-SET,github_domain,👨🏿‍💻 GitHub
  - RULE-SET,youtube_domain,📹 YouTube
  - RULE-SET,google_domain,🚀 节点选择
  - RULE-SET,onedrive_domain,🐬 OneDrive
  - RULE-SET,microsoft_domain,🪟 Microsoft
  - RULE-SET,apple_domain,🎯 全球直连
  - RULE-SET,tiktok_domain,🎵 TikTok
  - RULE-SET,telegram_domain,📲 Telegram
  - RULE-SET,netflix_domain,🎥 NETFLIX
  - RULE-SET,paypal_domain,💶 PayPal
  - RULE-SET,apple_ip,🎯 全球直连
  - RULE-SET,google_ip,🚀 节点选择
  - RULE-SET,netflix_ip,🎥 NETFLIX
  - RULE-SET,telegram_ip,📲 Telegram
  - RULE-SET,geolocation-!cn,🚀 节点选择
  - RULE-SET,cn_domain,🎯 全球直连
  - RULE-SET,cn_ip,🎯 全球直连
  - MATCH,🐟 漏网之鱼

# 规则集
